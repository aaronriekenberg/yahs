[package]
name = "yahs"
version = "2.8.1"
edition = "2024"

[[bin]]
name = "yahs"
path = "src/main.rs"

[lib]
name = "yahs"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
bytes = "1.11.1"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.6.1", features = ["derive"] }
futures = "0.3.32"
globset = "0.4.18"
http-body-util = "0.1.3"
httpdate = "1.0.3"
hyper = { version = "1.9.0", features = ["full"] }
hyper-rustls = { version = "0.27.9", features = ["native-tokio"] }
hyper-util = { version = "0.1.20", features = ["full"] }
mime = "0.3.17"
mime_guess = "2.0.5"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
socket2 = "0.6.3"
thiserror = "2.0.18"
tokio = { version = "1.52.3", features = ["full"] }
tokio-util = { version = "0.7.18", features = ["full"] }
toml = { version = "1.1.2", features = ["parse"] }
tower = { version = "0.5.3", features = ["full"] }
tower-http = { version = "0.6.11", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json"] }

[profile.release]
lto = true

[dev-dependencies]
tempfile = "3"
