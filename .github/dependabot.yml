version: 2

updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    allow:
      - dependency-type: "all"
    open-pull-requests-limit: 10
    commit-message:
      prefix: "fix"
